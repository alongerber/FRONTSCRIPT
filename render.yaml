services:
  - type: web
    name: front-studio
    runtime: docker
    region: frankfurt
    plan: starter
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /healthz
    disk:
      name: media
      mountPath: /var/data
      sizeGB: 10
    envVars:
      - key: MEDIA_ROOT
        value: /var/data
      - key: FFMPEG_THREADS
        value: "2"
      - key: SECRET_KEY
        generateValue: true
      - key: STUDIO_PASSWORD
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ELEVENLABS_API_KEY
        sync: false
      - key: HEYGEN_API_KEY
        sync: false
      - key: FAL_KEY
        sync: false
