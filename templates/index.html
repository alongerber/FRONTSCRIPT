<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>פרונט סטודיו</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/studio.css">
</head>
<body>

<div class="app">

  <header class="head">
    <div class="brand">פרונט<span>.</span></div>
    <div class="head-project" id="head-project"></div>
    <div class="head-spacer"></div>
    <div class="engine-pills" id="engine-pills"></div>
    <form method="post" action="/logout">
      <button class="btn btn-ghost btn-sm" type="submit">יציאה</button>
    </form>
  </header>

  <aside class="rail">
    <div class="rail-head">
      <button class="btn-new" id="btn-new">+ סרטון חדש</button>
    </div>
    <div class="rail-list">
      <div class="rail-label">הפרויקטים שלי</div>
      <div id="project-list"></div>
    </div>
  </aside>

  <main class="main">
    <nav class="steps" id="steps"></nav>
    <section class="stage" id="stage">
      <div class="stage-inner">
        <div class="empty">
          <div class="empty-icon">🎬</div>
          <div class="empty-title">בחר פרויקט או פתח חדש</div>
          <div class="empty-text">
            כל פרויקט הוא סרטון אחד. הוא זוכר הכל בדרך — אם תסגור עכשיו
            ותחזור מחר, תמשיך בדיוק מאיפה שעצרת.
          </div>
        </div>
      </div>
    </section>
  </main>

</div>

<div class="toasts" id="toasts"></div>
<div id="modal-root"></div>

<script type="module" src="/static/js/app.js"></script>
</body>
</html>
